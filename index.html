
<script>
const API = "https://taprush-api.derickainamani.workers.dev";
const BOT_USERNAME = "TapRushGobalBot";

const ADSGRAM_BLOCK_ID = "58504";
const ADSUN_BLOCK_ID = "50163";

const AD_REWARD = 100;
const DAILY_AD_LIMIT = 50;

const tg = window.Telegram && window.Telegram.WebApp;

let initData = "";
let player = null;
let tapQueue = 0;
let pumping = false;
let lastTapSent = 0;
let adBusy = false;
let adCount = 0;
let adRank = null;

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    el.style.display = "none";
  }, 3000);
}

async function api(path, method = "GET", data = {}) {
  const options = { method, headers: {} };

  if (method === "POST") {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify({ ...data, initData });
  }

  const response = await fetch(API + path, options);
  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Invalid server response.");
  }

  if (!response.ok || result.success === false) {
    throw new Error(result.error || "Request failed.");
  }

  return result;
}

function number(value) {
  return Number(value || 0).toLocaleString();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

/* =========================
   PLAYER DISPLAY
========================= */

function updateUI() {
  if (!player) return;

  const points = Number(player.points || 0);
  const energy = Number(player.energy || 0);
  const taps = Number(player.taps_today || 0);
  const streak = Number(player.streak || 0);
  const claimed = Number(player.mission_claimed || 0);

  document.getElementById("points").textContent = number(points);
  document.getElementById("energy").textContent =
    `${energy} / 500`;

  document.getElementById("energybar").style.width =
    (energy / 500 * 100) + "%";

  document.getElementById("streak").textContent = streak;
  document.getElementById("taps").textContent = `${taps}/100`;
  document.getElementById("mission").textContent = claimed ? "1" : "0";

  document.getElementById("missionbar").style.width =
    Math.min(taps, 100) + "%";

  document.getElementById("missionText").textContent =
    claimed
      ? "Mission completed! Bonus awarded."
      : `${taps} of 100 taps completed`;

  document.getElementById("tapButton").disabled = energy < 1;
  document.getElementById("tapButton").textContent =
    energy < 1 ? "NO ENERGY" : "TAP!";

  document.getElementById("tapStatus").textContent =
    energy < 1
      ? "Wait for energy to regenerate."
      : "Tap to collect points";

  document.getElementById("profilePoints").textContent = number(points);
  document.getElementById("profileEnergy").textContent = energy + " / 500";
  document.getElementById("profileStreak").textContent = streak;
  document.getElementById("profileTaps").textContent = taps + " / 100";

  document.getElementById("playerName").textContent =
    player.first_name || "Player";

  document.getElementById("playerUsername").textContent =
    player.username ? "@" + player.username : "Telegram player";

  const dailyButton = document.getElementById("dailyButton");
  dailyButton.disabled = player.daily_claimed === true;
  dailyButton.textContent = dailyButton.disabled ? "Claimed" : "Claim";

  document.getElementById("taskDaily").disabled =
    dailyButton.disabled;
}

/* =========================
   REGISTER AND REFRESH
========================= */

async function register() {
  if (!tg || !tg.initData) {
    throw new Error("Please open TapRush from Telegram.");
  }

  initData = tg.initData;

  const result = await api("/register", "POST");
  player = result.player;

  updateUI();

  const link =
    `https://t.me/${BOT_USERNAME}?startapp=${encodeURIComponent(player.referral_code)}`;

  document.getElementById("refLink").value = link;

  document.getElementById("connection").textContent = "● Connected";
  document.getElementById("connection").style.color = "#9de6bc";

  await refreshState();
  await Promise.all([
    loadLeaderboard(),
    loadReferralStats(),
    loadAdStatus(),
    loadMyRank()
  ]);
}

async function refreshState() {
  const result = await api("/state", "POST");
  player = { ...player, ...result.player };
  updateUI();
}

async function refreshAll() {
  try {
    await refreshState();

    await Promise.all([
      loadLeaderboard(),
      loadReferralStats(),
      loadAdStatus(),
      loadMyRank()
    ]);

    toast("Account updated.");
  } catch (error) {
    toast(error.message);
  }
}

/* =========================
   TAP GAME
========================= */

function tap() {
  if (!player || Number(player.energy) < 1) return;

  if (Number(player.energy) - tapQueue <= 0) {
    toast("Not enough energy.");
    return;
  }

  tapQueue++;

  document.getElementById("tapStatus").textContent =
    tapQueue + " tap(s) waiting to save...";

  if (tapQueue >= 10) {
    pumpTaps();
  } else if (!window.tapTimer) {
    window.tapTimer = setTimeout(() => {
      window.tapTimer = null;
      pumpTaps();
    }, 800);
  }
}

async function pumpTaps() {
  if (pumping || tapQueue < 1) return;

  pumping = true;

  if (window.tapTimer) {
    clearTimeout(window.tapTimer);
    window.tapTimer = null;
  }

  const wait = Math.max(0, 750 - (Date.now() - lastTapSent));

  if (wait) {
    await new Promise(resolve => setTimeout(resolve, wait));
  }

  const count = Math.min(10, tapQueue);
  tapQueue -= count;

  try {
    const result = await api("/tap", "POST", { count });

    player = result.player;
    lastTapSent = Date.now();

    updateUI();

    document.getElementById("tapStatus").textContent =
      tapQueue
        ? tapQueue + " tap(s) waiting to save..."
        : "Tap to collect points";

  } catch (error) {
    tapQueue = 0;
    toast(error.message);

    try {
      await refreshState();
    } catch {}
  }

  pumping = false;

  if (tapQueue > 0) pumpTaps();
}

document.getElementById("tapButton").addEventListener("click", tap);

/* =========================
   DAILY CHECK-IN
========================= */

async function claimDaily() {
  const buttons = [
    document.getElementById("dailyButton"),
    document.getElementById("taskDaily")
  ];

  buttons.forEach(button => button.disabled = true);

  try {
    const result = await api("/claim-daily", "POST");

    player = result.player;
    updateUI();

    toast("Daily reward claimed: +" +
      number(result.reward) + " points!");

  } catch (error) {
    toast(error.message);

    buttons.forEach(button => button.disabled = false);

    try {
      await refreshState();
    } catch {}
  }
}

document.getElementById("dailyButton")
  .addEventListener("click", claimDaily);

document.getElementById("taskDaily")
  .addEventListener("click", claimDaily);

/* =========================
   REWARDED AD INTERFACE
========================= */

function createAdInterface() {
  const card = document.getElementById("rewardedAdTask");
  if (!card) return;

  card.innerHTML = `
    <div class="row">
      <div class="ad-icon">▶️</div>
      <span class="pill">OPTIONAL REWARDS</span>
    </div>

    <h3 style="margin:14px 0 6px">Watch an advertisement</h3>

    <p class="notice">
      Earn 100 TapRush points for each successfully completed
      rewarded advertisement. Watching ads is optional.
    </p>

    <div class="token-grid">
      <div class="token-box">
        <span>REWARD PER AD</span>
        <strong>+100</strong>
      </div>
      <div class="token-box">
        <span>ADS WATCHED TODAY</span>
        <strong id="adsToday">0 / 50</strong>
      </div>
    </div>

    <div class="bar">
      <div id="adsProgress" style="width:0%"></div>
    </div>

    <p class="notice" id="adMessage">
      Choose an advertisement network below.
    </p>

    <button class="action full" id="adsgramButton">
      ▶ Watch with AdsGram
    </button>

    <button class="action secondary full"
      id="adsunButton" style="margin-top:10px">
      ▶ Watch with Adsun
    </button>

    <button class="action secondary full"
      id="refreshAdsButton" style="margin-top:10px">
      Refresh ad progress
    </button>

    <p class="notice">
      Maximum 50 rewarded advertisements per day across both
      networks combined. Incomplete advertisements earn no points.
    </p>
  `;

  document.getElementById("adsgramButton")
    .addEventListener("click", watchAdsGram);

  document.getElementById("adsunButton")
    .addEventListener("click", watchAdsun);

  document.getElementById("refreshAdsButton")
    .addEventListener("click", loadAdStatus);
}

function setAdMessage(message) {
  const el = document.getElementById("adMessage");
  if (el) el.textContent = message;
}

function setAdButtonsDisabled(disabled) {
  const ids = ["adsgramButton", "adsunButton"];

  ids.forEach(id => {
    const button = document.getElementById(id);
    if (button) button.disabled = disabled;
  });
}

function getAdCount(result) {
  return Number(
    result.ads_today ??
    result.today_count ??
    result.ad_count ??
    result.count ??
    result.total_today ??
    0
  );
}

function updateAdDisplay(result) {
  adCount = getAdCount(result);

  const remaining = Math.max(0, DAILY_AD_LIMIT - adCount);
  const countEl = document.getElementById("adsToday");
  const bar = document.getElementById("adsProgress");

  if (countEl) {
    countEl.textContent = `${adCount} / ${DAILY_AD_LIMIT}`;
  }

  if (bar) {
    bar.style.width =
      Math.min(100, adCount / DAILY_AD_LIMIT * 100) + "%";
  }

  const exhausted = remaining <= 0;

  const a = document.getElementById("adsgramButton");
  const b = document.getElementById("adsunButton");

  if (a) a.disabled = exhausted || adBusy;
  if (b) b.disabled = exhausted || adBusy;

  if (exhausted) {
    setAdMessage("You have reached today's 50-ad limit. Come back tomorrow.");
  }
}

async function loadAdStatus() {
  try {
    const result = await api("/ad-status", "POST");
    updateAdDisplay(result);
    return result;
  } catch (error) {
    console.log("Ad status:", error.message);
    return null;
  }
}

async function loadMyRank() {
  try {
    const result = await api("/my-rank", "POST");

    adRank =
      result.rank ??
      result.player_rank ??
      result.position ??
      null;

    const rankEl = document.getElementById("myRank");
    if (rankEl) {
      rankEl.textContent =
        adRank ? "#" + number(adRank) : "Not ranked yet";
    }

  } catch (error) {
    console.log("Player rank:", error.message);
  }
}

async function loadSDK(url, globalName) {
  if (window[globalName]) return window[globalName];

  if (window[globalName + "Loading"]) {
    return window[globalName + "Loading"];
  }

  window[globalName + "Loading"] = new Promise((resolve, reject) => {
    const script = document.createElement("script");

    script.src = url;
    script.async = true;

    script.onload = () => {
      if (window[globalName]) {
        resolve(window[globalName]);
      } else {
        reject(new Error(globalName + " SDK did not initialize."));
      }
    };

    script.onerror = () => reject(
      new Error("Could not load " + globalName + " SDK.")
    );

    document.head.appendChild(script);
  });

  return window[globalName + "Loading"];
}

async function beginAd() {
  if (adBusy) throw new Error("An advertisement is already running.");

  const status = await loadAdStatus();

  if (status && getAdCount(status) >= DAILY_AD_LIMIT) {
    throw new Error("You have reached today's 50-ad limit.");
  }

  adBusy = true;
  setAdButtonsDisabled(true);

  return adCount;
}

async function finishAd() {
  adBusy = false;
  setAdButtonsDisabled(false);

  await Promise.all([
    refreshState(),
    loadAdStatus(),
    loadMyRank()
  ]);
}

/* =========================
   ADSGRAM
========================= */

async function watchAdsGram() {
  try {
    await beginAd();

    setAdMessage("Preparing AdsGram advertisement...");

    const sdk = await loadSDK(
      "https://sad.adsgram.ai/js/sad.min.js",
      "Adsgram"
    );

    const start = await api("/ad-start", "POST");

    const sessionId =
      start.session_id ??
      start.sessionId ??
      start.id;

    if (!sessionId) {
      throw new Error("The server did not create an ad session.");
    }

    const controller = sdk.init({
      blockId: ADSGRAM_BLOCK_ID
    });

    const result = await controller.show();

    if (!result || result.done !== true) {
      setAdMessage("Advertisement was not completed. No points awarded.");
      toast("Ad not completed. No reward.");
      return;
    }

    setAdMessage("Ad completed. Confirming your reward...");

    const claim = await api("/claim-ad", "POST", {
      session_id: sessionId
    });

    if (claim.player) {
      player = claim.player;
      updateUI();
    }

    toast("AdsGram reward claimed: +100 points!");

    await loadAdStatus();
    await loadMyRank();

  } catch (error) {
    console.log("AdsGram:", error);
    toast(error.message || "AdsGram could not complete.");
    setAdMessage(error.message || "AdsGram unavailable.");

  } finally {
    await finishAd().catch(() => {});
  }
}

/* =========================
   ADSUN
========================= */

async function watchAdsun() {
  let startingCount = adCount;

  try {
    startingCount = await beginAd();

    setAdMessage("Preparing Adsun advertisement...");

    const sdk = await loadSDK(
      "https://api.adsun.io/sdk.js",
      "Adsun"
    );

    const controller = sdk.init({
      blockId: ADSUN_BLOCK_ID
    });

    await controller.show();

    setAdMessage(
      "Advertisement finished. Waiting for Adsun's server to verify your reward..."
    );

    /*
      IMPORTANT:
      Adsun rewards are credited by the server callback.
      A successful SDK promise alone does NOT award points.
    */

    let credited = false;

    for (let i = 0; i < 20; i++) {
      await new Promise(resolve => setTimeout(resolve, 1500));

      const status = await loadAdStatus();

      if (status && getAdCount(status) > startingCount) {
        credited = true;
        break;
      }
    }

    await refreshState();

    if (credited) {
      toast("Adsun reward confirmed: +100 points!");
      setAdMessage("Your Adsun reward has been confirmed.");
    } else {
      toast("Ad finished. Reward verification is still pending.");
      setAdMessage(
        "Ad finished. The server has not confirmed the reward yet. Refresh your progress shortly."
      );
    }

  } catch (error) {
    console.log("Adsun:", error);
    toast(error.message || "Adsun could not complete.");
    setAdMessage(error.message || "Adsun unavailable.");

  } finally {
    await finishAd().catch(() => {});
  }
}

/* =========================
   LEADERBOARD
========================= */

async function loadLeaderboard() {
  const list = document.getElementById("leaderList");

  list.innerHTML = '<div class="empty">Loading players...</div>';

  try {
    const result = await api("/leaderboard");

    if (!result.leaderboard || !result.leaderboard.length) {
      list.innerHTML =
        '<div class="empty">No players yet. Be among the first!</div>';
      return;
    }

    list.innerHTML = result.leaderboard.map(p => {
      const name = escapeHTML(
        p.username
          ? "@" + p.username
          : p.first_name || "Player"
      );

      return `
        <div class="leader">
          <div class="rank">${escapeHTML(p.rank)}</div>
          <div class="person">
            <strong>${name}</strong>
            <span>TapRush player</span>
          </div>
          <div class="score">${number(p.points)} pts</div>
        </div>
      `;
    }).join("");

  } catch (error) {
    list.innerHTML =
      '<div class="empty">Could not load rankings.</div>';
  }
}

/* =========================
   REFERRALS
========================= */

async function loadReferralStats() {
  try {
    const result = await api("/referral-stats", "POST");

    document.getElementById("refTotal").textContent =
      number(result.total_referrals);

    document.getElementById("refSuccess").textContent =
      number(result.successful_referrals);

    document.getElementById("refPoints").textContent =
      number(result.points_earned);

  } catch (error) {
    console.log("Referral stats:", error.message);
  }
}

async function copyReferral() {
  const link = document.getElementById("refLink").value;

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(link);
    } else {
      const input = document.getElementById("refLink");
      input.select();
      document.execCommand("copy");
    }

    toast("Referral link copied!");

  } catch {
    toast("Please copy the link manually.");
  }
}

function shareReferral() {
  const link = document.getElementById("refLink").value;

  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(
      "https://t.me/share/url?url=" +
      encodeURIComponent(link) +
      "&text=" +
      encodeURIComponent("Join me on TapRush!")
    );

  } else if (navigator.share) {
    navigator.share({
      title: "TapRush",
      text: "Join me on TapRush!",
      url: link
    });

  } else {
    copyReferral();
  }
}

/* =========================
   NAVIGATION
========================= */

function showPage(page) {
  document.querySelectorAll(".page").forEach(section => {
    section.classList.toggle("active", section.id === page);
  });

  document.querySelectorAll(".nav button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  if (page === "leaderboard") {
    loadLeaderboard();
    loadMyRank();
  }

  if (page === "friends") {
    loadReferralStats();
  }

  if (page === "tasks") {
    loadAdStatus();
  }
}

/* =========================
   PERSONAL RANK DISPLAY
========================= */

function addPersonalRank() {
  const card = document.querySelector("#leaderboard .card");
  if (!card || document.getElementById("myRank")) return;

  const rankBox = document.createElement("div");

  rankBox.style.cssText =
    "margin-top:14px;padding:14px;background:#202541;border-radius:14px;display:flex;justify-content:space-between;align-items:center";

  rankBox.innerHTML = `
    <strong>Your current rank</strong>
    <strong id="myRank" style="color:var(--gold)">
      Loading...
    </strong>
  `;

  card.appendChild(rankBox);
}

/* =========================
   START APPLICATION
========================= */

async function startApp() {
  try {
    if (tg) {
      tg.ready();
      tg.expand();

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#0b0c19");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#0b0c19");
      }
    }

    createAdInterface();
    addPersonalRank();

    await register();

    setInterval(async () => {
      if (!pumping && tapQueue === 0 && !adBusy) {
        try {
          await refreshState();
        } catch {}
      }
    }, 15000);

  } catch (error) {
    console.log("TapRush startup:", error);

    document.getElementById("connection").textContent =
      "● Offline";

    document.getElementById("connection").style.color =
      "#ff7777";

    document.getElementById("tapButton").disabled = true;
    document.getElementById("tapButton").textContent = "OFFLINE";

    document.getElementById("tapStatus").textContent =
      error.message;

    toast(error.message);
  }
}

startApp();
</script>
